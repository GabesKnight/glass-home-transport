<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GlassHome Hub</title><style>
*{box-sizing:border-box}body{background:#101a20;color:#eef6f4;font:20px Arial,sans-serif;margin:0;padding:22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:38px;margin:4px 0}small,footer,#status{color:#a8c0c1}#clock{font-size:40px}select{font:16px Arial;background:#25383e;color:white;padding:9px;border:1px solid #627b7e;border-radius:9px;max-width:42%}.row{display:flex;align-items:center;gap:18px;padding:13px;background:#203139;border-radius:14px;margin:9px 0}.badge{background:#24784e;padding:12px;border-radius:9px;font-weight:bold}.dest{flex:1}.mins{font-size:32px;color:#a7efbd;font-weight:bold}footer{font-size:13px;margin-top:12px}a{color:inherit}#status{font-size:16px}p{margin:12px 0}
</style><header><div><small>GLASSHOME TRANSPORT</small><h1>Next trams</h1></div><div id="clock"></div></header><p><select id="route" aria-label="Route"></select> <select id="origin" aria-label="Departure stop"></select> <select id="destination" aria-label="Destination"></select></p><div id="status">Loading timetable…</div><main id="rows"></main><footer>Scheduled, not real-time · Melbourne time · <a href="https://opendata.transport.vic.gov.au/dataset/gtfs-schedule">State of Victoria (Department of Transport and Planning), GTFS Schedule</a> · Modified data, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></footer><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),zone='Australia/Melbourne';let catalog,route,serial=0;
const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function parts(d){return Object.fromEntries(fmt.formatToParts(d).map(x=>[x.type,x.value]))}
function options(el,items,value){el.replaceChildren(...items.map(([v,t])=>new Option(t,v)));if(items.some(x=>x[0]===value))el.value=value}
async function json(path){const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function active(c,date,w){if(!c)return false;const e=c[1].find(x=>String(x[0])===date);return e?String(e[1])==='1':c[0].some(x=>String(x[0])<=date&&date<=String(x[1])&&String(x[2])[w]==='1')}
function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('en-AU',{timeZone:zone,hour:'numeric',minute:'2-digit'});if(!route)return;const p=parts(now),today=Date.UTC(+p.year,+p.month-1,+p.day),o=$('origin').value,d=$('destination').value,rows=[],seen=new Set();for(let delta=-1;delta<=2;delta++){const day=new Date(today+delta*86400000),ds=day.toISOString().slice(0,10).replace(/-/g,''),w=(day.getUTCDay()+6)%7;const guess=day.getTime()+3600000;const z=parts(new Date(guess));const offset=Date.UTC(+z.year,+z.month-1,+z.day,+z.hour,+z.minute,+z.second)-guess;const base=day.getTime()-offset;for(const [seq,offs,services] of route.patterns){for(let i=0;i<seq.length;i++){if(String(seq[i])!==o||offs[i][1]===null||Number(offs[i][2])===1)continue;let j=-1;for(let k=i+1;k<seq.length;k++)if((!d||String(seq[k])===d)&&Number(offs[k][3])!==1)j=k;if(j<0)continue;for(const [service,bases] of Object.entries(services)){if(!active(route.calendar[service],ds,w))continue;for(const b of bases){const t=base+(Number(b)+Number(offs[i][1]))*1000,key=t+'|'+seq[j];if(t<now.getTime()||seen.has(key))continue;seen.add(key);rows.push([t,route.stops[seq[j]]])}}}}}rows.sort((a,b)=>a[0]-b[0]);$('rows').replaceChildren(...rows.slice(0,4).map(([t,dest])=>{const row=document.createElement('div');row.className='row';for(const [cls,val] of [['badge',route.number],['dest',dest],['mins',Math.ceil((t-now)/60000)+' min']]){const e=document.createElement('span');e.className=cls;e.textContent=val;row.append(e)}return row}));$('status').textContent=rows.length?'Scheduled departures · '+route.stops[o]:'No upcoming scheduled departures for this selection'}
function save(){const u=new URL(location.href);for(const k of ['route','origin','destination'])u.searchParams.set(k,$(k).value);history.replaceState(null,'',u);tick()}
async function loadRoute(po,pd){const id=$('route').value,n=++serial;route=null;$('rows').replaceChildren();$('status').textContent='Loading route…';try{const r=await json(catalog.routes.find(x=>String(x.id)===id).file);if(n!==serial)return;route=r;const stops=Object.entries(r.stops).sort((a,b)=>a[1].localeCompare(b[1]));options($('origin'),stops,po||stops.find(x=>/clements dr/i.test(x[1]))?.[0]);options($('destination'),[['','Any destination'],...stops],pd||'');save()}catch(e){$('status').textContent=e.message}}
async function start(){try{catalog=await json('catalog.json');const routes=catalog.routes.filter(x=>x.mode==='tram').sort((a,b)=>Number(a.number)-Number(b.number));options($('route'),routes.map(x=>[String(x.id),x.number+' · '+x.name]),q.get('route')||String(routes.find(x=>String(x.number)==='86')?.id));await loadRoute(q.get('origin'),q.get('destination'))}catch(e){$('status').textContent='Cannot load timetable: '+e.message}}
$('route').onchange=()=>loadRoute();$('origin').onchange=save;$('destination').onchange=save;setInterval(tick,15000);setInterval(()=>location.reload(),3600000);tick();start();
</script></html>
